@if (isOpen()) {
  <div class="modal-overlay" (click)="onClose()">
    <div class="modal-content" [style.max-width]="maxWidth()" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-content">
          <span class="modal-header-icon">
            <i class="fa-solid fa-building-flag"></i>
          </span>
          <h3>{{ title() }}</h3>
        </div>
        <button class="modal-close-btn" (click)="onClose()" type="button" aria-label="Cerrar modal">
          ✕
        </button>
      </div>
      <div class="modal-body">
        <ng-content select="[modal-body]"></ng-content>
        <ng-content></ng-content>
      </div>
      <ng-content select="[modal-footer]"></ng-content>
      @if (showDefaultFooter()) {
        <div class="modal-footer">
          <button class="btn btn-secondary" (click)="onClose()" [disabled]="loading()" type="button">
            {{ cancelText() }}
          </button>
          <button class="btn btn-primary" (click)="onSave()" [disabled]="loading()" type="button">
            @if (loading()) {
              <i class="fa-solid fa-spinner fa-spin"></i> Guardando...
            } @else {
              <i [class]="submitIcon()"></i> {{ submitText() }}
            }
          </button>
        </div>
      }
    </div>
  </div>
}
