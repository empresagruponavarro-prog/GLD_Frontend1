@if (aviso(); as a) {
  <div class="app-aviso" [class.app-aviso--ok]="a.tipo === 'ok'" [class.app-aviso--aviso]="a.tipo === 'aviso'"
    role="alert" data-testid="aviso-global">
    <i class="fa-solid" [class.fa-circle-exclamation]="a.tipo !== 'ok'" [class.fa-circle-check]="a.tipo === 'ok'" aria-hidden="true"></i>
    <span class="app-aviso__texto">{{ a.texto }}</span>
    <button type="button" class="app-aviso__cerrar" (click)="cerrarAviso()" aria-label="Cerrar aviso" data-testid="aviso-global-cerrar">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>
}

@if (isBareView()) {
  <router-outlet></router-outlet>
} @else {
<!-- Barra Superior (Header) con Botón de Menú Hamburguesa -->
<header class="app-header">
  <div style="display: flex; align-items: center; gap: 0.75rem;">
    <!-- Botón Hamburguesa para Ocultar/Mostrar el Menú Lateral -->
    <button class="hamburger-btn" (click)="toggleSidebar()" title="Ocultar o Mostrar Menú Lateral" aria-label="Ocultar o mostrar menú lateral">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>

    <a class="brand" routerLink="/" style="cursor: pointer; display: flex; align-items: center; gap: 0.65rem; text-decoration: none;">
      <img src="assets/logo.png" alt="Logo GLD" style="height: 28px; width: 28px; object-fit: contain; border-radius: 4px; background-color: #ffffff; padding: 2px;">
      <span>SistemaGLD2026</span>
    </a>
  </div>

  <!-- Usuario conectado y cierre de sesión -->
  @if (usuario(); as u) {
    <div class="app-user-menu relative">
      <button #userMenuButton type="button" (click)="toggleUserMenu()"
        class="flex items-center gap-2 rounded-md px-2 py-1 text-left text-white hover:bg-white/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#5a9e80]"
        aria-haspopup="true" aria-controls="app-user-menu-panel" [attr.aria-expanded]="isUserMenuOpen()"
        data-testid="user-menu-button">
        <i class="fa-solid fa-user-circle" style="font-size: 1.25rem; color: #5a9e80;" aria-hidden="true"></i>
        <span class="flex flex-col leading-tight">
          <span class="text-sm font-semibold" data-testid="header-usuario">{{ nombreUsuario() }}</span>
          <span class="text-xs text-white/70" data-testid="header-rol">{{ u.rol }}@if (u.area) { · <span data-testid="header-area">{{ u.area.nombre }}</span> }</span>
        </span>
        <i class="fa-solid fa-chevron-down text-xs text-white/70" aria-hidden="true"></i>
      </button>
      @if (isUserMenuOpen()) {
        <div id="app-user-menu-panel" class="absolute right-0 z-50 mt-2 w-56 overflow-hidden rounded-lg border border-slate-200 bg-white py-1 text-slate-700 shadow-lg">
          <div class="border-b border-slate-100 px-4 py-2 text-xs text-slate-500">
            Conectado como <strong class="text-slate-700">{{ u.usuario }}</strong>
          </div>
          <button type="button" (click)="logout()" data-testid="logout-button"
            class="flex w-full items-center gap-2 px-4 py-2 text-left text-sm hover:bg-slate-100 focus:bg-slate-100 focus:outline-none">
            <i class="fa-solid fa-right-from-bracket text-red-600" aria-hidden="true"></i>
            Cerrar sesión
          </button>
        </div>
      }
    </div>
  }
</header>

<!-- Contenedor Principal con Estado de Menú Colapsable -->
<div class="app-container" [class.sidebar-collapsed]="isSidebarCollapsed()">
  <app-sidebar></app-sidebar>
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
}
