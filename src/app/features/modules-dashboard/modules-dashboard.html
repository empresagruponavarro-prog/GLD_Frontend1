<div class="content-header">
  <div>
    <h1 class="content-title">Menú de Módulos Principal</h1>
    <p class="content-subtitle">Selecciona el módulo de GLD al que deseas ingresar.</p>
  </div>
</div>

<div class="content-body">
  <div class="modules-grid">
    @for (mod of modules; track mod.title) {
      @if (mod.route) {
        <div class="module-card" [routerLink]="mod.route">
          <div class="module-icon">
            <i [class]="mod.icon"></i>
          </div>
          <span class="module-title">{{ mod.title }}</span>
        </div>
      } @else {
        <div class="module-card module-card--disabled" aria-disabled="true">
          <div class="module-icon">
            <i [class]="mod.icon"></i>
          </div>
          <span class="module-title">{{ mod.title }}</span>
          <span class="module-badge">Próximamente</span>
        </div>
      }
    }
  </div>
</div>
