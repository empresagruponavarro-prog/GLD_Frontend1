<app-modal
  [isOpen]="isOpen()"
  [title]="esEdicion() ? 'Editar partida' : 'Nueva partida'"
  icon="fa-solid fa-layer-group"
  [showDefaultFooter]="false"
  maxWidth="480px"
  (closed)="closed.emit()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" id="form-partida" class="space-y-3">
    <div class="grid grid-cols-3 gap-3">
      <div>
        <label class="obra-ctl-label" for="par-item">Ítem</label>
        <input id="par-item" type="text" class="obra-ctl-input" formControlName="item" maxlength="20" placeholder="03" />
      </div>
      <div class="col-span-2">
        <label class="obra-ctl-label" for="par-tipo">Tipo</label>
        <select id="par-tipo" class="obra-ctl-input" formControlName="tipo">
          <option value="CONTRACTUAL">Contractual</option>
          <option value="ADICIONAL">Adicional (fuera del contrato)</option>
        </select>
      </div>
    </div>
    <div>
      <label class="obra-ctl-label" for="par-nombre">Nombre de la partida</label>
      <input id="par-nombre" type="text" class="obra-ctl-input" formControlName="nombre" maxlength="150" placeholder="Obras civiles" />
      <p class="obra-ctl-hint">Las subpartidas heredan el tipo de su partida. Los adicionales se separan en la Curva S.</p>
    </div>

    @if (formError()) {
      <p class="obra-ctl-error" role="alert">{{ formError() }}</p>
    }

    <div class="obra-ctl-acciones">
      <button type="button" class="obra-ctl-btn" (click)="closed.emit()">Cancelar</button>
      @if (puedeGuardar()) {
        <button type="submit" class="obra-ctl-btn obra-ctl-btn--primario" [disabled]="isSaving()">
          {{ isSaving() ? 'Guardando…' : esEdicion() ? 'Guardar cambios' : 'Crear partida' }}
        </button>
      }
    </div>
  </form>
</app-modal>
