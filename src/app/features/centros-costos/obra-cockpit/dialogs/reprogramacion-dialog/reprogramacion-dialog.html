<app-modal
  [isOpen]="isOpen()"
  [title]="esEdicion() ? 'Editar reprogramación' : 'Reprogramar obra'"
  icon="fa-solid fa-calendar-plus"
  [showDefaultFooter]="false"
  maxWidth="500px"
  (closed)="closed.emit()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" id="form-reprogramacion" class="space-y-3">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="obra-ctl-label" for="rep-desde">Desde</label>
        <input id="rep-desde" type="date" class="obra-ctl-input" formControlName="desde" />
      </div>
      <div>
        <label class="obra-ctl-label" for="rep-dias">Días a desplazar</label>
        <input id="rep-dias" type="number" min="1" max="60" class="obra-ctl-input obra-ctl-input--num" formControlName="dias" />
      </div>
    </div>
    <div>
      <label class="obra-ctl-label" for="rep-motivo">Motivo</label>
      <select id="rep-motivo" class="obra-ctl-input" formControlName="motivo">
        @for (m of motivos; track m.valor) {
          <option [value]="m.valor">{{ m.etiqueta }}</option>
        }
      </select>
      <p class="obra-ctl-hint">Un motivo externo mueve el fin vigente de la obra; «Interno» se contabiliza como atraso y no lo mueve.</p>
    </div>
    <div>
      <label class="obra-ctl-label" for="rep-detalle">Detalle (opcional)</label>
      <input id="rep-detalle" type="text" class="obra-ctl-input" formControlName="detalle" maxlength="300" />
    </div>

    @if (formError()) {
      <p class="obra-ctl-error" role="alert">{{ formError() }}</p>
    }

    <div class="obra-ctl-acciones">
      <button type="button" class="obra-ctl-btn" (click)="closed.emit()">Cancelar</button>
      @if (puedeGuardar()) {
        <button type="submit" class="obra-ctl-btn obra-ctl-btn--primario" [disabled]="isSaving()">
          {{ isSaving() ? 'Guardando…' : esEdicion() ? 'Guardar cambios' : 'Reprogramar' }}
        </button>
      }
    </div>
  </form>
</app-modal>
