<app-modal
  [isOpen]="isOpen()"
  maxWidth="460px"
  [showHeader]="false"
  [showDefaultFooter]="false"
  (closed)="cancelar()"
>
  @let doc = documento();
  <div modal-body class="-m-[10px]" role="alertdialog" aria-labelledby="doc-eliminar-titulo" aria-describedby="doc-eliminar-detalle">
    <div class="h-1 bg-rose-500" aria-hidden="true"></div>
    <div class="px-6 pt-6 pb-5 flex flex-col items-center text-center gap-3">
      <div class="w-14 h-14 rounded-2xl bg-rose-50 border border-rose-100 text-rose-600 flex items-center justify-center" aria-hidden="true">
        <span class="material-symbols-outlined text-3xl">delete</span>
      </div>
      <h2 id="doc-eliminar-titulo" class="text-xl font-extrabold text-on-surface m-0">Eliminar documento</h2>
      <div id="doc-eliminar-detalle" class="flex flex-col gap-1.5">
        <p class="text-sm text-on-surface m-0 break-words">
          Se eliminará <strong>«{{ doc.titulo }}»</strong> del repositorio de la obra.
        </p>
        @if (archivoLocal()) {
          <p class="text-xs text-on-surface-variant m-0 break-all">
            También se borrará su archivo adjunto: {{ nombreArchivo() }}.
          </p>
        }
        <p class="text-xs font-semibold text-rose-700 m-0">Esta acción no se puede deshacer.</p>
      </div>
      @if (error()) {
        <p class="w-full flex items-start gap-2 rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-2.5 text-xs font-medium text-rose-800 text-left m-0" role="alert">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">error</span> {{ error() }}
        </p>
      }
    </div>
  </div>

  <div modal-footer class="flex items-center justify-end gap-2.5 px-6 py-4 bg-slate-50 border-t border-slate-100">
    <button type="button" id="btn-eliminar-cancelar" class="px-5 h-10 rounded-xl border border-slate-200 bg-white text-sm font-semibold text-on-surface hover:bg-slate-50 disabled:opacity-60 cursor-pointer" (click)="cancelar()" [disabled]="eliminando()">Cancelar</button>
    <button type="button" id="btn-eliminar-confirmar" class="inline-flex items-center gap-2 px-5 h-10 rounded-xl bg-rose-600 text-white text-sm font-semibold shadow-sm hover:bg-rose-700 disabled:opacity-60 cursor-pointer" (click)="confirmar()" [disabled]="eliminando()">
      @if (eliminando()) {
        <span class="material-symbols-outlined text-[18px] animate-spin" aria-hidden="true">progress_activity</span> Eliminando…
      } @else {
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">delete</span> Eliminar
      }
    </button>
  </div>
</app-modal>
